name: Bug Report
description: Report a problem with the readme skill
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
      placeholder: Describe the issue
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1. Run `/readme` on [project type]
        2. Select [options]
        3. Observe [problem]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include the generated output if relevant.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Skill Mode
      options:
        - Create (no existing README)
        - Improve (existing README)
        - Companion files
        - Dry run
    validations:
      required: true
  - type: input
    id: project-type
    attributes:
      label: Project Type
      description: What type of project were you running the skill against?
      placeholder: "e.g., Node.js API, Python CLI, Rust library, monorepo"
