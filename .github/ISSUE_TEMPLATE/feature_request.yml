name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What's missing or frustrating?
      placeholder: "When I run /readme on a [project type], it doesn't..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered other approaches?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Create mode
        - Improve mode
        - Companion files
        - Project detection
        - New project type support
        - Arguments / configuration
        - Other
    validations:
      required: true
