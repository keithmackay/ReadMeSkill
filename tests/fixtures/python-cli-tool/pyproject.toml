[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csvkit-lite"
version = "0.3.1"
description = "A lightweight CSV processing toolkit for the command line"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Jane Developer", email = "jane@example.com" }]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.scripts]
csvk = "csvkit_lite.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
