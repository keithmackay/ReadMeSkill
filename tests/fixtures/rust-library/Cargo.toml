[package]
name = "fastcache"
version = "0.2.0"
edition = "2021"
description = "A high-performance, thread-safe caching library with TTL support"
license = "MIT"
repository = "https://github.com/example/fastcache"
documentation = "https://docs.rs/fastcache"
categories = ["caching", "concurrency"]
keywords = ["cache", "ttl", "concurrent", "lru"]

[lib]
name = "fastcache"
path = "src/lib.rs"

[dependencies]
parking_lot = "0.12"
hashbrown = "0.14"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "cache_bench"
harness = false
